app = "lox-amp-reviewbot"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  WORKER_CONCURRENCY = "2"
  REVIEW_TIMEOUT_MINUTES = "30"
  FAIL_ON = "high"
  AMP_THREAD_VISIBILITY = "private"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
